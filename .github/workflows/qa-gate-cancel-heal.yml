# Copy alongside qa-gate.yml on the default branch.
# A workflow cannot listen to itself; this companion heals the source gate.
name: QA Gate Cancel Heal

on:
  workflow_run:
    workflows: ["QA Gate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: qa-cancel-heal-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  qa-cancel-heal:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'cancelled' &&
      github.event.workflow_run.event != 'push'
    # Same ceiling as the `qa` job: GitHub checks EVERY job of the called
    # file against this job's ceiling (incl. the evaluator, which needs
    # pull-requests/issues write for label stripping); the refresh path
    # itself narrows to actions: write.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/qa-gate.yml@1335569ba86645df8be423e42c136a2625aaeebb # devflow-gates main @ 1335569
    with:
      runs_on: '["self-hosted", "linux", "x64"]'
      qa_label: 'qa-passed'
      allowed_labelers: ${{ vars.QA_LABELERS || 'qianhaoq' }}
