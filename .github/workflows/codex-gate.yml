# Example caller for the reusable Codex Review Gate — copy to
# YOUR_REPO/.github/workflows/codex-gate.yml.
#
# Required-check name produced by this example (job id `codex`):
#   - "codex / Codex Review Gate"
#
# pull_request_target keeps the workflow YAML on the trusted base branch
# while evaluating untrusted PRs; the reusable gate is read-only and
# never checks out the PR head.
#
# Triggers (PR-only, deduplicated to save Actions minutes):
#   - pull_request_target: push / open / ready / draft, plus labeled /
#     unlabeled. Gate-relevant label (`skip-codex-gate`) → real evaluate
#     (job `codex`). Any OTHER label → job `codex-label-ack` mirrors the
#     latest "codex / Codex Review Gate" conclusion via Checks API (no
#     runner on the reusable gate; no "is expected" ghost). A run whose
#     jobs all skip would hang the required check — never do that.
#   - pull_request_review (submitted) by Codex only. One Codex review with
#     N inline comments = ONE run.
#   - pull_request_review_comment by Codex only, and only when it is an
#     EDIT or a thread REPLY (e.g. a finding edited into P0/P1). New
#     top-level inline comments are part of a submitted review, which
#     already evaluates — the old unfiltered trigger fired N more runs.
#   - issue_comment → the REFRESH job, only for comments by Codex (summary
#     created/edited, "no major issues") or a "/recheck" comment. Its
#     conclusion would land on the default branch, so it does not
#     evaluate: it re-runs the latest failed head gate run only if the
#     gate would now pass (else at most the newest cancelled one; one
#     re-run per PR; never past run_attempt 3).
#   - workflow_dispatch(pr_number): evaluates; attaches to the PR head only
#     when dispatched ON the PR branch (e.g. GITHUB_TOKEN-created PRs).
#   - No schedule: thread resolution (webhook-only, cannot trigger
#     Actions) is picked up by the next Codex comment, a push, or a
#     "/recheck" comment on the PR. Add an hourly-or-slower cron only if
#     you really need it (each scheduled run boots a runner).
# Cancel-heal requires upstream devflow-gates companion workflow support; do not self-listen.
#
# Concurrency (never lets one event class cancel another):
#   - push-class runs (opened / synchronize / reopened) share one group per
#     PR with cancel-in-progress: a new commit cancels the evaluation of
#     the OLDER head only (that cancelled check sits on the old SHA).
#   - relevant refresh runs (Codex / "/recheck" comments) queue per PR
#     (a running one is never cancelled).
#   - labeled/unlabeled MUST share label-{head.sha} + cancel-in-progress
#     (Plan B) across evaluate + ack: this is the primary TOCTOU lock.
#     Mirror revalidation is defense only. A later triage label
#     may cancel unfinished skip-codex-gate evaluate; reapply it or /recheck.
#   - every other run (Codex reviews, dispatch, skipped events)
#     gets its own group: never cancelled, never cancels. Gate runs are
#     ~15 s, read live state, and are idempotent.

name: Codex Review Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate (dispatch on the PR branch to attach the check)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

# Re-run attempts (run_attempt > 1, e.g. from a refresh) never join the
# cancelling push group: a re-run of an OLD head's synchronize run would
# otherwise cancel the newest head's evaluation.
concurrency:
  # Plan B: serialize label evaluate + ack by PR + SHA to close mirror TOCTOU.
  # A later triage label can cancel an unfinished relevant-label evaluate;
  # accepted tradeoff: reapply the relevant label or use /recheck to evaluate.
  group: >-
    codex-gate-pr-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || 'none' }}-${{
    (github.event_name == 'pull_request_target' && github.run_attempt == '1' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)) && 'push' ||
    (github.event_name == 'issue_comment' &&
      (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' || github.event.comment.user.login == 'chatgpt-codex-connector' ||
       startsWith(github.event.comment.body, '/recheck'))) && 'refresh' ||
    (github.event_name == 'pull_request_target' && contains(fromJSON('["labeled","unlabeled"]'), github.event.action)) && format('label-{0}', github.event.pull_request.head.sha) ||
    format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && ((github.run_attempt == '1' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)) || contains(fromJSON('["labeled","unlabeled"]'), github.event.action)) }}

jobs:
  codex:
    # Real evaluate: non-label PRT events, or labeled/unlabeled for
    # skip-codex-gate only. Irrelevant labels go to codex-label-ack.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
        (github.event.review.user.login == 'chatgpt-codex-connector[bot]' || github.event.review.user.login == 'chatgpt-codex-connector')) ||
      (github.event_name == 'pull_request_review_comment' &&
        (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' || github.event.comment.user.login == 'chatgpt-codex-connector') &&
        (github.event.action == 'edited' || github.event.comment.in_reply_to_id)) ||
      (github.event_name == 'pull_request_target' &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
         github.event.label.name == 'skip-codex-gate'))
    # GitHub checks EVERY job of the called file against this job's
    # ceiling (incl. the refresh job, which needs actions: write); the
    # evaluator's own token stays read-only.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/codex-gate.yml@42fdd49f44c69f4e748c6f8e9bf1ac2b0ffb18e2  # devflow-gates main @ 42fdd49 (方案 B; bump deliberately)
    with:
      runs_on: '["self-hosted", "linux", "x64"]'
      wait_minutes: 20

  # Anti-ghost ack (方案 B): irrelevant labels must NOT skip every job
  # (that leaves "codex / Codex Review Gate" as "is expected"). Mirror the
  # latest same-named conclusion via Checks API instead — no false green
  # (refuses to invent a conclusion when none exists).
  codex-label-ack:
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'skip-codex-gate'
    permissions:
      contents: read
      checks: write
      actions: write
      issues: write
    uses: qianhaoq/devflow-gates/.github/workflows/mirror-required-check.yml@42fdd49f44c69f4e748c6f8e9bf1ac2b0ffb18e2  # devflow-gates main @ 42fdd49 (方案 B; bump deliberately)
    with:
      # Keep in sync with the required-check name this caller produces.
      check_name: 'codex / Codex Review Gate'
      runs_on: '["self-hosted", "linux", "x64"]'

  # Refresh path — Codex comments and "/recheck" only (see header).
  codex-refresh:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
       github.event.comment.user.login == 'chatgpt-codex-connector' ||
       startsWith(github.event.comment.body, '/recheck'))
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/codex-gate.yml@42fdd49f44c69f4e748c6f8e9bf1ac2b0ffb18e2  # devflow-gates main @ 42fdd49 (方案 B; bump deliberately)
    with:
      runs_on: '["self-hosted", "linux", "x64"]'
      wait_minutes: 20
