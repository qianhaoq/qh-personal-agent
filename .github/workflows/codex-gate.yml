# Example caller: copy to .github/workflows/codex-gate.yml.
# Required check: "codex / Codex Review Gate".
# pull_request_target uses trusted base YAML; never check out or execute PR code.
# Also install codex-gate-cancel-heal.yml: self-listening workflow_run is invalid.
# Irrelevant labels mirror only a same-named real gate verdict; success requires
# current relevant-label state to match the source verdict's event history.
# Evaluate and ack share label-{sha}; unrelated-label ack never cancels evaluation.
# Push, refresh, and heal runs remain isolated; reruns never cancel new pushes.
name: Codex Review Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate (dispatch on the PR branch to attach the check)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

# Re-run attempts (run_attempt > 1, e.g. from a refresh) never join the
# cancelling push group: a re-run of an OLD head's synchronize run would
# otherwise cancel the newest head's evaluation.
concurrency:
  # Shared label-{sha} is the main lock: evaluate and ack cannot run concurrently.
  # Only relevant-label evaluate cancels running work; unrelated-label ack never does.
  # Ack may replace a pending evaluate; mirror label-event time validation then
  # rejects stale success with failure, rather than bypassing that evaluation.
  group: >-
    codex-gate-pr-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || 'none' }}-${{
    (github.event_name == 'pull_request_target' && github.run_attempt == '1' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)) && 'push' ||
    (github.event_name == 'issue_comment' &&
      (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' || github.event.comment.user.login == 'chatgpt-codex-connector' ||
       startsWith(github.event.comment.body, '/recheck'))) && 'refresh' ||
    (github.event_name == 'pull_request_target' && contains(fromJSON('["labeled","unlabeled"]'), github.event.action)) && format('label-{0}', github.event.pull_request.head.sha) ||
    format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && ((github.run_attempt == '1' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)) || (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && contains(fromJSON('["skip-codex-gate","no-auto-merge"]'), github.event.label.name))) }}

jobs:
  codex:
    # Real evaluate: non-label PRT events, or labeled/unlabeled for
    # skip-codex-gate / no-auto-merge. Irrelevant labels go to codex-label-ack.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
        (github.event.review.user.login == 'chatgpt-codex-connector[bot]' || github.event.review.user.login == 'chatgpt-codex-connector')) ||
      (github.event_name == 'pull_request_review_comment' &&
        (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' || github.event.comment.user.login == 'chatgpt-codex-connector') &&
        (github.event.action == 'edited' || github.event.comment.in_reply_to_id)) ||
      (github.event_name == 'pull_request_target' &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
         (github.event.label.name == 'skip-codex-gate' || github.event.label.name == 'no-auto-merge')))
    # GitHub checks EVERY job of the called file against this job's
    # ceiling (incl. the refresh job, which needs actions: write); the
    # evaluator's own token stays read-only.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/codex-gate.yml@647105c2e3eae7f428b2219dd2c16b369ae235b5 # devflow-gates main @ 647105c
    with:
      runs_on: '["self-hosted", "linux", "x64"]'
      wait_minutes: 20

  # Anti-ghost ack (方案 B): irrelevant labels must NOT skip every job
  # (that leaves "codex / Codex Review Gate" as "is expected"). Mirror the
  # latest same-named conclusion via Checks API instead — no false green
  # (refuses to invent a conclusion when none exists).
  codex-label-ack:
    # Job name = required prefix: this job IS "codex / Codex Review Gate"
    # (conclusion = latest real verdict; no checks.create).
    name: codex
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'skip-codex-gate' && github.event.label.name != 'no-auto-merge'
    permissions:
      contents: read
      checks: read
      actions: write
      issues: write
      pull-requests: read   # private repos: mirror label validation (issues.get/listEvents)
    uses: qianhaoq/devflow-gates/.github/workflows/mirror-required-check.yml@647105c2e3eae7f428b2219dd2c16b369ae235b5 # devflow-gates main @ 647105c
    with:
      relevant_labels: 'skip-codex-gate,no-auto-merge'
      # Keep in sync with the required-check name this caller produces.
      check_name: 'codex / Codex Review Gate'
      job_name: 'Codex Review Gate'
      wait_minutes: 30   # > real gate max runtime + runner queue
      runs_on: '["self-hosted", "linux", "x64"]'

  # Refresh path — Codex comments and "/recheck" only (see header).
  codex-refresh:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
       github.event.comment.user.login == 'chatgpt-codex-connector' ||
       startsWith(github.event.comment.body, '/recheck'))
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/codex-gate.yml@647105c2e3eae7f428b2219dd2c16b369ae235b5 # devflow-gates main @ 647105c
    with:
      runs_on: '["self-hosted", "linux", "x64"]'
      wait_minutes: 20
