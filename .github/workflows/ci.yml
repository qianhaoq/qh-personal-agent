# CI — reusable build/test + secret scan from qianhaoq/devflow-gates.
# Required checks: "ci / Build & Test", "ci / Secret Scan".
# Trigger on pull_request (NOT pull_request_target): Build & Test runs PR code.
#
# Skeleton-friendly: scripts/ci-test.sh runs the server checks only when
# server/ has Python code and the Gradle build only when android/ has a
# Gradle project, so the empty skeleton passes.

name: CI

on:
  pull_request:
    # edited: base retarget re-runs CI (not filtered: a skipped required check counts as passing).
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
    # Docs-only merges don't need a post-merge CI run (PR CI stays unfiltered:
    # a required check must never go missing on a PR).
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    # `edited` fires on every title/body edit; only a base retarget needs CI.
    # Caller-level skip: the skipped check is named after this job, never
    # the required "ci / Build & Test" (whose last result stays in force).
    if: github.event.action != 'edited' || github.event.changes.base != null
    uses: qianhaoq/devflow-gates/.github/workflows/ci.yml@1335569ba86645df8be423e42c136a2625aaeebb # devflow-gates main @ 1335569
    with:
      runs_on: '["self-hosted", "linux", "x64"]'
      python_version: ''  # self-hosted Debian: skip setup-python; python3.12 on PATH via uv
      setup_command: ''
      test_command: 'bash scripts/ci-test.sh'
      working_directory: '.'

  # Server tests against a real PostgreSQL 16 (row locks / conditional
  # updates in tests/test_concurrency.py are only meaningful on PG; the
  # required "ci / Build & Test" runs the same suite on SQLite).
  # NOT a required check yet. The reusable devflow-gates CI has no
  # `services` support, so this lives in the caller as its own job.
  # Skips cleanly while server/ has no tests (e.g. the skeleton on main).
  # Detection runs first in a service-less job so that, while server/ has no
  # tests, PostgreSQL is never pulled or started (services start before any
  # step of the job that declares them). Discovery mirrors scripts/ci-test.sh.
  # The image is pgvector/pgvector:pg16 (PostgreSQL 16 + the `vector`
  # extension) so the real mem0ai + pgvector integration tests
  # (server/tests/test_mem0_integration.py, local fake embedder, no external
  # API calls) run here instead of skipping. Detection is content-based, not
  # a path filter: whenever server/ has tests the job runs on every PR, so
  # changes to server/requirements-mem0.txt or app/memory/mem0_store.py are
  # always exercised.
  pg-detect:
    # `edited` fires on every title/body edit; only a base retarget needs CI.
    # Caller-level skip: the skipped check is named after this job, never
    # the required "ci / Build & Test" (whose last result stays in force).
    if: github.event.action != 'edited' || github.event.changes.base != null
    name: PG Tests (detect)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect server tests
        id: detect
        run: |
          if [ -d server ] && find server \( -name 'test_*.py' -o -name '*_test.py' \) -not -path '*/.venv/*' | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "server/ has no tests yet: PG tests skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

  pg-tests:
    name: PG Tests (PostgreSQL 16, non-required)
    needs: pg-detect
    if: needs.pg-detect.outputs.run == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        # Official postgres:16 + the pgvector extension (same entrypoint/env).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: personal
          POSTGRES_PASSWORD: ci-only-postgres-pw
          POSTGRES_DB: personal_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal -d personal_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Same scheme as server/tests/conftest.py expects (SQLAlchemy async + asyncpg).
      # Throwaway CI-only credentials for the ephemeral service container.
      TEST_DATABASE_URL: postgresql+asyncpg://personal:ci-only-postgres-pw@localhost:5432/personal_agent_test
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same dependency layouts as scripts/ci-test.sh (pytest always; then
      # requirements.txt and/or pyproject.toml when present).
      - name: Install server dependencies
        run: |
          python -m pip install -q pytest
          if [ -f server/requirements.txt ]; then python -m pip install -q -r server/requirements.txt; fi
          if [ -f server/pyproject.toml ]; then python -m pip install -q -e server; fi
          # Optional mem0 backend (mem0ai + psycopg) for the real pgvector
          # integration tests; absent on main until PR #2 lands.
          if [ -f server/requirements-mem0.txt ]; then python -m pip install -q -r server/requirements-mem0.txt; fi

      # test_mem0_integration.py skips (not fails) when the `vector`
      # extension is missing, and the tests only check for it. POSTGRES_USER is
      # the superuser in this image, so enable it here and fail loudly if the
      # image ever stops shipping it.
      - name: Enable pgvector extension
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U personal -d personal_agent_test \
            -c 'CREATE EXTENSION IF NOT EXISTS vector' \
            -c "SELECT extname, extversion FROM pg_extension WHERE extname = 'vector'"

      - name: pytest on PostgreSQL 16 + pgvector
        working-directory: server
        env:
          # Belt and braces: the mem0 fixture already sets this per test.
          MEM0_TELEMETRY: 'False'
        run: python -m pytest -q -rs
