# Acceptance Gate (M1, observe-only) from qianhaoq/devflow-gates.
# Produces "acceptance / Acceptance Gate" — NOT a required check in M1.
# Config: .github/acceptance.yml. Must stay on pull_request (runs PR code).

name: Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

permissions: {}

jobs:
  acceptance:
    # Saves Actions minutes: label events for other labels skip without
    # booting a runner (Measure runs the PR's tests). Keep in sync with
    # tests_changed.exempt_label if .github/acceptance.yml changes it.
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'no-test-needed'
    permissions:
      contents: read
      pull-requests: write   # sticky report comment
      checks: read           # read the Codex gate result
    uses: qianhaoq/devflow-gates/.github/workflows/acceptance.yml@7e029a2c7d549e86e80331267928281f53ba180b # devflow-gates main @ 7e029a2
    with:
      runs_on: '["self-hosted", "linux", "x64"]'
