# Example caller for the reusable QA Gate — copy to
# YOUR_REPO/.github/workflows/qa-gate.yml.
#
# Required-check name produced by this example (job id `qa`):
#   - "qa / QA Gate"
#
# pull_request_target keeps the workflow YAML on the trusted base branch.
#
# IMPORTANT: the gate REMOVES the QA label on every new push
# (synchronize), which needs write access — the caller must grant
# pull-requests: write and issues: write (a reusable workflow can only
# restrict permissions further, never elevate them).
#
# Schedule (*/15): a scheduled run's own conclusion does NOT attach to
# any PR head check, so the schedule path never evaluates. The reusable
# workflow's "QA Gate Refresh" job instead re-runs the most recent FAILED
# pull_request_target-originated Gate run for every open non-draft PR
# whose gate check is failing (actions.reRunWorkflowFailedJobs) — the
# re-run keeps the original pull_request_target event, so the fresh
# conclusion re-attaches to the PR head check. That API needs
# `actions: write`, granted here on the schedule-path job ONLY
# (`qa-refresh`); the evaluator job `qa` keeps the label-removal
# permissions only. Expect failing PRs to be re-evaluated every 15
# minutes until green or closed.
#
# Concurrency: one evaluation per PR; a stale in-flight run is cancelled
# by the newer event. Schedule runs fall back to a unique run_id group
# (nothing to cancel).

# PERMISSIONS: GitHub validates the permissions of EVERY job in a called
# workflow against the calling job's ceiling, even jobs skipped by `if`.
# The reusable file contains both the evaluator (pull-requests/issues: write) and the
# refresh job (actions: write), so both caller jobs grant the union. The
# callee still narrows each job's own token.
#
name: QA Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate (e.g. after re-applying the QA label)'
        required: true
        type: string
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  # pull_request_target runs (the ones that attach the PR-head check) get
  # their own group so a workflow_dispatch re-evaluation cannot cancel them.
  group: qa-gate-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}-${{ github.event_name == 'pull_request_target' && 'target' || 'aux' }}
  cancel-in-progress: true

jobs:
  qa:
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/qa-gate.yml@1a6a4a85728b0c1f3482a52020f94cb8208c73f5  # devflow-gates main @ 1a6a4a8 (pinned; bump deliberately)
    with:
      qa_label: 'qa-passed'
      # Only these logins' labeled event counts as QA sign-off (repo var QA_LABELERS overrides).
      allowed_labelers: ${{ vars.QA_LABELERS || 'qianhaoq' }}

  # Schedule path only — see the header note. actions: write is scoped to
  # this job; it re-runs failing pull_request_target gate runs.
  qa-refresh:
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/qa-gate.yml@1a6a4a85728b0c1f3482a52020f94cb8208c73f5  # devflow-gates main @ 1a6a4a8 (pinned; bump deliberately)
