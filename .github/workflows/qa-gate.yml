  #   if: github.event_name == 'schedule'
  #   permissions:
  #     contents: read
  #     pull-requests: read
  #     issues: read
  #     actions: write
  #   uses: qianhaoq/devflow-gates/.github/workflows/qa-gate.yml@1f36c8aa40e288a7154a8aa9f6077c45d826857f # devflow-gates main @ 1f36c8a
  #   with:
  #     runs_on: '["self-hosted", "linux", "x64"]'   # keep in sync with qa job above
