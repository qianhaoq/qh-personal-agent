# Example caller: copy to .github/workflows/qa-gate.yml.
# Required check: "qa / QA Gate".
# pull_request_target uses trusted base YAML; never check out or execute PR code.
# Also install qa-gate-cancel-heal.yml: self-listening workflow_run is invalid.
# Irrelevant labels mirror only a same-named real gate verdict; success requires
# current relevant-label state to match the source verdict's event history.
# Evaluate and ack share label-{sha}; unrelated-label ack never cancels evaluation.
# Push, refresh, and heal runs remain isolated; reruns never cancel new pushes.
name: QA Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate (dispatch on the PR branch to attach the check)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

# Re-run attempts (run_attempt > 1, e.g. from a refresh) never join the
# cancelling push group: a re-run of an OLD head's synchronize run would
# otherwise cancel the newest head's evaluation.
concurrency:
  # Shared label-{sha} is the main lock: evaluate and ack cannot run concurrently.
  # Only relevant-label evaluate cancels running work; unrelated-label ack never does.
  # Ack may replace a pending evaluate; mirror label-event time validation then
  # rejects stale success with failure, rather than bypassing that evaluation.
  group: >-
    qa-gate-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number || 'none' }}-${{
    (github.event_name == 'pull_request_target' && github.run_attempt == '1' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)) && 'push' ||
    (github.event_name == 'pull_request_target' && contains(fromJSON('["labeled","unlabeled"]'), github.event.action)) && format('label-{0}', github.event.pull_request.head.sha) ||
    format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && ((github.run_attempt == '1' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)) || (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && contains(fromJSON('["qa-passed","no-auto-merge"]'), github.event.label.name))) }}

jobs:
  qa:
    # Real evaluate: non-label PRT events, or labeled/unlabeled for the
    # QA label / no-auto-merge. Irrelevant labels go to qa-label-ack (anti-ghost).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
         (github.event.label.name == 'qa-passed' || github.event.label.name == 'no-auto-merge')))
    # GitHub checks EVERY job of the called file against this job's
    # ceiling (incl. the skipped refresh job, which needs actions: write);
    # the evaluator itself narrows to actions: read.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/qa-gate.yml@1f36c8aa40e288a7154a8aa9f6077c45d826857f # devflow-gates main @ 1f36c8a
    with:
      runs_on: '["self-hosted", "linux", "x64"]'
      qa_label: 'qa-passed'
      # Only these logins' labeled event counts as QA sign-off (repo var QA_LABELERS overrides).
      allowed_labelers: ${{ vars.QA_LABELERS || 'qianhaoq' }}

  # Anti-ghost ack (方案 B): irrelevant labels must NOT skip every job.
  qa-label-ack:
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'qa-passed' && github.event.label.name != 'no-auto-merge'
    permissions:
      contents: read
      checks: write
      actions: write
      issues: write
      pull-requests: read   # private repos: mirror label validation (issues.get/listEvents)
    uses: qianhaoq/devflow-gates/.github/workflows/mirror-required-check.yml@1f36c8aa40e288a7154a8aa9f6077c45d826857f # devflow-gates main @ 1f36c8a
    with:
      relevant_labels: 'qa-passed,no-auto-merge'
      check_name: 'qa / QA Gate'
      runs_on: '["self-hosted", "linux", "x64"]'

  # OPTIONAL schedule path: add `schedule: [{cron: '17 */6 * * *'}]` under
  # `on:` only if you need it. It never blindly re-runs a red gate (see
  # the reusable workflow's QA Gate Refresh job).
