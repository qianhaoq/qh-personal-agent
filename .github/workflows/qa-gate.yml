  #   if: github.event_name == 'schedule'
  #   permissions:
  #     contents: read
  #     pull-requests: read
  #     issues: read
  #     actions: write
  #   uses: qianhaoq/devflow-gates/.github/workflows/qa-gate.yml@37aef857960dd425a1d48ef781818c89d889db2c  # devflow-gates main @ 37aef85 (pinned; bump deliberately)
